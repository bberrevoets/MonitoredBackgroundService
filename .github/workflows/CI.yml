name: Build and Publish Final NuGet Package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x' # Adjust according to your project's target framework

    - name: Restore dependencies
      run: dotnet restore

    - name: Build the solution
      run: dotnet build --configuration Release --no-restore

    - name: Run tests
      run: dotnet test --no-restore --verbosity normal

  markdown:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Lint Markdown
      uses: DavidAnson/markdownlint-cli2-action@v24
      with:
        globs: '**/*.md'

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-latest
    # Trusted Publishing: no stored API key. A job with `permissions` gets nothing it does not list, so checkout
    # needs `contents: read`; `id-token: write` lets NuGet/login request GitHub's OIDC token.
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x' # Adjust according to your project's target framework

    - name: Restore dependencies
      run: dotnet restore

    - name: Build the solution
      run: dotnet build --configuration Release --no-restore

    - name: Pack Final NuGet package (with symbols)
      run: dotnet pack Berrevoets.MonitoredBackgroundService/Berrevoets.MonitoredBackgroundService.csproj --configuration Release --output "${{ github.workspace }}\output" /p:IncludeSymbols=true /p:SymbolPackageFormat=snupkg

    # Exchanges the OIDC token for a NuGet API key that is valid for 1 hour (policy on nuget.org: owner bberrevoets,
    # repository MonitoredBackgroundService, workflow CI.yml). Requested right before the pushes.
    - name: NuGet login (OIDC, Trusted Publishing)
      id: login
      uses: NuGet/login@v1
      with:
        user: bberrevoets

    - name: Publish Final NuGet package
      run: dotnet nuget push "${{ github.workspace }}\output\*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Publish Symbol Package (.snupkg)
      run: dotnet nuget push "${{ github.workspace }}\output\*.snupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
